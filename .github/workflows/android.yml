name: Derleme (Android + Web)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android proje iskeletini oluştur
        run: |
          flutter --version
          flutter create --platforms=android --org com.yildiz --project-name son_gun .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py

      - name: Paketleri indir
        run: flutter pub get

      - name: Testler
        run: flutter test

      - name: APK derle
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: son-gun-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Telefondan indirme linki (deneme sürümü)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk SonGun.apk
          gh release delete deneme --yes --cleanup-tag || true
          gh release create deneme SonGun.apk --target "${{ github.sha }}" --prerelease \
            --title "Son Gün - deneme sürümü" \
            --notes "Telefondan SonGun.apk dosyasına dokunup indir, sonra açıp kur. Android 'bilinmeyen kaynak' izni isteyebilir."

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Web sürümünü derle
        run: |
          flutter create --platforms=web --org com.yildiz --project-name son_gun .
          rm -f test/widget_test.dart
          python3 tool/patch_web.py
          flutter pub get
          flutter build web --release --base-href /son-gun/

      - name: Mağaza ekran görüntüleri
        continue-on-error: true
        run: |
          pip install playwright==1.48.0
          python3 -m playwright install --with-deps chromium
          mkdir -p /tmp/site && cp -r build/web /tmp/site/son-gun
          (cd /tmp/site && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          python3 tool/screens.py http://localhost:8080/son-gun/ build/web/shots
          ls build/web/shots

      - name: GitHub Pages'e yayınla (gh-pages dalı)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/web
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Web deneme sürümü ${{ github.sha }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
