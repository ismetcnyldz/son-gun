name: Derleme (Android + Web)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android proje iskeletini oluştur
        run: |
          flutter --version
          flutter create --platforms=android --org com.yildiz --project-name son_gun .
          rm -f test/widget_test.dart

      - name: Yayın imza anahtarı (GitHub Secrets'ta varsa)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/upload.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=upload.jks\n" "$KP" "$KP" > android/key.properties
            echo "İmza anahtarı bulundu."
          else
            echo "İmza anahtarı yok: deneme imzasıyla derlenecek."
          fi
          python3 tool/patch_android.py

      - name: Paketleri indir ve simgeleri üret
        run: |
          flutter pub get
          dart run flutter_launcher_icons -f tool/icons_android.yaml

      - name: Testler
        run: flutter test

      - name: APK ve mağaza paketi (AAB) derle
        env:
          RC_ANDROID_KEY: ${{ secrets.RC_ANDROID_KEY }}
        run: |
          ARGS="--release --build-number=${{ github.run_number }} --dart-define=RC_ANDROID_KEY=$RC_ANDROID_KEY"
          flutter build apk $ARGS
          flutter build appbundle $ARGS

      - uses: actions/upload-artifact@v4
        with:
          name: son-gun-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Telefondan indirme linki (deneme sürümü)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Vakitbil.apk
          cp build/app/outputs/bundle/release/app-release.aab Vakitbil.aab
          gh release delete deneme --yes --cleanup-tag || true
          gh release create deneme Vakitbil.apk Vakitbil.aab --target "${{ github.sha }}" --prerelease \
            --title "Vakitbil - deneme sürümü" \
            --notes "Telefondan Vakitbil.apk dosyasına dokunup indir, sonra açıp kur. Android 'bilinmeyen kaynak' izni isteyebilir."

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Web sürümünü derle
        run: |
          flutter create --platforms=web --org com.yildiz --project-name son_gun .
          rm -f test/widget_test.dart
          python3 tool/patch_web.py
          flutter pub get
          dart run flutter_launcher_icons -f tool/icons_web.yaml
          flutter build web --release --base-href /son-gun/uygulama/
          # Site düzeni: kök (tanıtım), /uygulama (web sürümü), /yasal (gizlilik, KVKK, şartlar)
          mkdir -p build/site
          cp site/tanitim/index.html build/site/index.html
          cp -r build/web build/site/uygulama
          cp -r site/yasal build/site/yasal
          cp assets/icon/icon.png build/site/icon.png

      - name: Mağaza ekran görüntüleri
        continue-on-error: true
        run: |
          pip install playwright==1.48.0
          python3 -m playwright install --with-deps chromium
          mkdir -p /tmp/site/son-gun && cp -r build/web /tmp/site/son-gun/uygulama
          (cd /tmp/site && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          python3 tool/screens.py http://localhost:8080/son-gun/uygulama/ build/site/shots
          python3 tool/frames.py build/site/shots build/site/store
          ls -R build/site/store

      - name: GitHub Pages'e yayınla (gh-pages dalı)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Web deneme sürümü ${{ github.sha }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages

  ios:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: iPhone sürümünü derle (imzasız, kontrol için)
        run: |
          flutter create --platforms=ios --org com.yildiz --project-name son_gun .
          rm -f test/widget_test.dart
          python3 tool/patch_ios.py
          flutter pub get
          dart run flutter_launcher_icons -f tool/icons_ios.yaml
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
