name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android proje iskeletini oluştur
        run: |
          flutter --version
          flutter create --platforms=android --org com.yildiz --project-name son_gun .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py

      - name: Paketleri indir
        run: flutter pub get

      - name: Testler
        run: flutter test

      - name: APK derle
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: son-gun-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Telefondan indirme linki (deneme sürümü)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk SonGun.apk
          gh release delete deneme --yes --cleanup-tag || true
          gh release create deneme SonGun.apk --target "${{ github.sha }}" --prerelease \
            --title "Son Gün - deneme sürümü" \
            --notes "Telefondan SonGun.apk dosyasına dokunup indir, sonra açıp kur. Android 'bilinmeyen kaynak' izni isteyebilir."
